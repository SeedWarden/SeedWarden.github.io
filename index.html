<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SeedWarden – Password Manager on SeedSigner Hardware">
  <meta name="theme-color" content="#ff6a00">
  <title>SeedWarden</title>

  <!-- favicon using the same logo -->
  <link rel="icon" href="assets/logo_64.png" type="image/png">

  <style>
    :root {
      --orange: #ff6a00;
      --orange-dark: #e55f00;
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --text: #f0f0f0;
      --text-muted: #a0a0a0;
      --border: #2a2a2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header / Hero */
    header {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.5rem;
    }

    .logo {
      width: 160px;
      height: auto;
      margin-bottom: 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(255, 106, 0, 0.15);
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      color: var(--text);
    }

    .tagline {
      font-size: clamp(1.1rem, 3vw, 1.35rem);
      color: var(--text-muted);
      max-width: 28rem;
      margin-bottom: 2.5rem;
    }

    /* Simple future-proof navigation placeholder */
    nav {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    nav a {
      display: inline-block;
      padding: 0.7rem 1.4rem;
      background: var(--orange);
      color: white;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: background 0.15s ease;
    }

    nav a:hover {
      background: var(--orange-dark);
    }

    nav a.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    nav a.secondary:hover {
      border-color: var(--orange);
      color: var(--orange);
    }

    /* Footer */
    footer {
      padding: 1.5rem;
      text-align: center;
      font-size: 0.875rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }

    footer a {
      color: var(--orange);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* Responsive tweaks */
    @media (max-width: 480px) {
      .logo {
        width: 120px;
      }
      nav {
        flex-direction: column;
        width: 100%;
        max-width: 260px;
      }
      nav a {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="assets/logo_512.png" alt="SeedWarden logo" class="logo" width="160" height="160">
    <h1>SeedWarden</h1>
    <p class="tagline">Password Manager on SeedSigner Hardware.</p>

    <nav>
      <!-- Easy to extend later -->
      <a href="stateless-qr/stateless-qr.html">QR Tool</a>
      <!-- Example of a secondary link you can add later:
      <a href="docs/" class="secondary">Documentation</a>
      -->
    </nav>
  </header>

  <footer>
    <p>SeedWarden · <a href="https://github.com/SeedWarden">GitHub</a></p>
  </footer>
</body>
</html>
