<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ff6a00">
  <meta name="description" content="Stateless QR – Generate and scan QR codes offline">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Stateless QR</title>

  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="logo_192.png">
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --orange: #ff6a00;
      --orange-dark: #e55f00;
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --text: #f0f0f0;
      --text-muted: #a0a0a0;
      --border: #2a2a2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 1rem;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    header img {
      width: 40px;
      height: 40px;
      border-radius: 8px;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    /* Text area with clear button */
    .input-wrap {
      position: relative;
      margin-bottom: 1rem;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      padding: 0.9rem 2.5rem 0.9rem 0.9rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 16px; /* prevents zoom on iOS */
      resize: vertical;
      font-family: inherit;
    }

    textarea:focus {
      outline: none;
      border-color: var(--orange);
    }

    .clear-btn {
      position: absolute;
      top: 0.7rem;
      right: 0.7rem;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: var(--border);
      color: var(--text-muted);
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .clear-btn:hover {
      background: #444;
      color: var(--text);
    }

    .clear-btn.visible {
      display: flex;
    }

    /* QR display */
    #qr-container {
      width: 100%;
      aspect-ratio: 1;
      max-width: 300px;
      margin: 0 auto 1.25rem;
      background: #fff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #qr-container canvas {
      max-width: 100%;
      max-height: 100%;
    }

    /* Camera */
    #video-wrap {
      display: none;
      width: 100%;
      max-width: 300px;
      aspect-ratio: 1;
      margin: 0 auto 1.25rem;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    #video-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #scan-canvas {
      display: none;
    }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 0.75rem;
    }

    button {
      flex: 1;
      padding: 0.85rem 1rem;
      border: none;
      border-radius: 10px;
      background: var(--orange);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    button:active {
      opacity: 0.85;
    }

    button.secondary {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }

    button.secondary:hover {
      border-color: var(--orange);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      min-height: 1.3em;
    }

    .hidden {
      display: none !important;
    }

    footer {
      margin-top: auto;
      padding-top: 1.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    footer a {
      color: var(--orange);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.svg" alt="logo" width="40" height="40">
    <h1>Stateless QR</h1>
  </header>

  <div class="input-wrap">
    <textarea id="text" placeholder="Type or paste text / secret here…" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
    <button type="button" class="clear-btn" id="clear-btn" title="Clear" aria-label="Clear text">×</button>
  </div>

  <div id="qr-container">
    <canvas id="qr"></canvas>
  </div>

  <div id="video-wrap">
    <video id="video" playsinline muted></video>
  </div>
  <canvas id="scan-canvas"></canvas>

  <div class="btn-row">
    <button id="btn-scan">Scan QR</button>
    <button id="btn-cancel" class="secondary hidden">Cancel</button>
    <button id="btn-download" class="secondary" disabled>Download PNG</button>
  </div>

  <div id="status"></div>

  <!-- Libraries (place these files next to the HTML or adjust paths) -->
  <script src="js/qrcode.min.js"></script>
  <script src="js/jsQR.js"></script>

  <script>
    (function () {
      const textEl     = document.getElementById('text');
      const clearBtn   = document.getElementById('clear-btn');
      const qrCanvas   = document.getElementById('qr');
      const videoWrap  = document.getElementById('video-wrap');
      const video      = document.getElementById('video');
      const scanCanvas = document.getElementById('scan-canvas');
      const btnScan    = document.getElementById('btn-scan');
      const btnCancel  = document.getElementById('btn-cancel');
      const btnDownload= document.getElementById('btn-download');
      const status     = document.getElementById('status');
      const qrContainer= document.getElementById('qr-container');

      let stream = null;
      let scanning = false;
      let animId = null;

      // ----- Generator (UTF-8 / Byte mode) -----
      function updateQR() {
        const raw = textEl.value;
        clearBtn.classList.toggle('visible', raw.length > 0);
        btnDownload.disabled = !raw;

        if (!raw) {
          const ctx = qrCanvas.getContext('2d');
          ctx.clearRect(0, 0, qrCanvas.width, qrCanvas.height);
          return;
        }

        try {
          const qr = qrcode(0, 'M');          // auto version, Medium ECC
          qr.addData(raw, 'Byte');            // proper UTF-8
          qr.make();

          const cell = 6;
          const size = qr.getModuleCount();
          const margin = 2;
          const canvasSize = (size + margin * 2) * cell;

          qrCanvas.width = canvasSize;
          qrCanvas.height = canvasSize;

          const ctx = qrCanvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvasSize, canvasSize);
          ctx.fillStyle = '#000000';

          for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
              if (qr.isDark(r, c)) {
                ctx.fillRect((c + margin) * cell, (r + margin) * cell, cell, cell);
              }
            }
          }
          status.textContent = '';
        } catch (e) {
          status.textContent = 'QR error: ' + e.message;
          btnDownload.disabled = true;
        }
      }

      textEl.addEventListener('input', updateQR);
      textEl.addEventListener('paste', () => setTimeout(updateQR, 0));

      // Clear button
      clearBtn.addEventListener('click', () => {
        textEl.value = '';
        textEl.focus();
        updateQR();
      });

      // Download PNG
      btnDownload.addEventListener('click', () => {
        if (!textEl.value) return;
        const link = document.createElement('a');
        link.download = 'qr-code.png';
        link.href = qrCanvas.toDataURL('image/png');
        link.click();
      });

      // ----- Scanner -----
      async function startScan() {
        if (scanning) return;
        status.textContent = 'Requesting camera…';
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
          });
          video.srcObject = stream;
          await video.play();
          scanning = true;
          videoWrap.style.display = 'block';
          qrContainer.classList.add('hidden');
          btnScan.classList.add('hidden');
          btnCancel.classList.remove('hidden');
          btnDownload.classList.add('hidden');
          status.textContent = 'Point at a QR code…';
          tick();
        } catch (err) {
          status.textContent = 'Camera error: ' + (err.message || err);
          stopScan();
        }
      }

      function stopScan() {
        scanning = false;
        if (animId) cancelAnimationFrame(animId);
        if (stream) {
          stream.getTracks().forEach(t => t.stop());
          stream = null;
        }
        video.srcObject = null;
        videoWrap.style.display = 'none';
        qrContainer.classList.remove('hidden');
        btnScan.classList.remove('hidden');
        btnCancel.classList.add('hidden');
        btnDownload.classList.remove('hidden');
        status.textContent = '';
      }

      function tick() {
        if (!scanning) return;
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          const w = video.videoWidth;
          const h = video.videoHeight;
          scanCanvas.width = w;
          scanCanvas.height = h;
          const ctx = scanCanvas.getContext('2d');
          ctx.drawImage(video, 0, 0, w, h);
          const imageData = ctx.getImageData(0, 0, w, h);
          const code = jsQR(imageData.data, imageData.width, imageData.height, {
            inversionAttempts: 'dontInvert'
          });
          if (code) {
            textEl.value = code.data;
            updateQR();
            status.textContent = 'Scanned!';
            stopScan();
            return;
          }
        }
        animId = requestAnimationFrame(tick);
      }

      btnScan.addEventListener('click', startScan);
      btnCancel.addEventListener('click', stopScan);

      // Initial state
      updateQR();
    })();
  </script>
</body>
</html>
